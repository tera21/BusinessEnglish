<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 영단어 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .card-container { perspective: 1000px; cursor: pointer; -webkit-tap-highlight-color: transparent; height: 380px; flex-shrink: 0; }
        .card-inner { transition: transform 0.4s ease-in-out; transform-style: preserve-3d; width: 100%; height: 100%; position: relative; }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card-back { transform: rotateY(180deg); background-color: #059669; color: white; }
        .card-front { background-color: white; z-index: 2; }
        .flipped .card-inner { transform: rotateY(180deg); }
        .no-events { pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800 select-none">

    <!-- Header -->
    <header class="bg-white px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">모바일 영단어 퀴즈</h1>
                <p id="statusText" class="text-xs font-semibold text-gray-500">초기화 중...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="shareLink()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg></button>
            <button onclick="openSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-between p-4 max-w-lg mx-auto w-full">
        <!-- Progress Bar -->
        <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-sm mb-4">
            <div class="flex items-center gap-2">
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-1 rounded">진행도</span>
                <span id="progressText" class="font-bold text-gray-800">0 / 0</span>
            </div>
            <button onclick="fetchCSVData(localStorage.getItem('sheetCsvUrl'))" class="text-sm font-semibold text-emerald-600 flex items-center gap-1 hover:text-emerald-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 동기화
            </button>
        </div>

        <!-- Flashcard -->
        <div class="card-container my-auto" onclick="toggleCard()">
            <div id="cardInner" class="card-inner">
                
                <!-- 뜻 (앞면) -->
                <div class="card-front p-6">
                    <p class="text-sm font-bold text-gray-400 mb-4 tracking-widest no-events">뜻 (MEANING)</p>
                    <h2 id="meaningText" class="text-4xl font-extrabold text-gray-800 text-center break-keep leading-tight no-events">로딩 중...</h2>
                    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 whitespace-nowrap no-events">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        화면을 터치해 단어 확인
                    </div>
                </div>

                <!-- 영단어 (뒷면) -->
                <div class="card-back p-6">
                    <p class="text-sm font-bold text-emerald-200 mb-4 tracking-widest opacity-80 no-events">영단어 (WORD)</p>
                    <h2 id="wordText" class="text-5xl font-extrabold text-center break-words leading-tight no-events">Word</h2>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mt-4">
            <button onclick="nextWord(false)" class="flex-1 bg-white border-2 border-gray-200 text-gray-700 font-bold py-4 rounded-2xl shadow-sm active:bg-gray-50 flex justify-center items-center gap-2 text-lg transition-all">
                <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> 몰랐어요
            </button>
            <button onclick="nextWord(true)" class="flex-1 bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-sm active:bg-emerald-700 flex justify-center items-center gap-2 text-lg transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 알고 있었어요
            </button>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-gray-900 mb-4">설정 및 연동</h3>
            <div class="bg-blue-50 text-blue-800 text-sm p-4 rounded-xl mb-4 leading-relaxed border border-blue-100">
                <p class="font-bold mb-1">ℹ️ 구글 시트 연동 방법</p>
                1. 구글 시트 메뉴: <b>파일 > 공유 > 웹에 게시</b><br>
                2. '전체 문서' 옆에 <b>'쉼표로 분리된 값 (.csv)'</b> 선택<br>
                3. <b>[게시]</b> 버튼 클릭 후 생성된 링크 복사
            </div>
            <label class="block text-sm font-bold text-gray-700 mb-2">구글 시트 CSV 링크</label>
            <input type="text" id="sheetUrlInput" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm mb-6 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100" placeholder="https://docs.google.com/spreadsheets/d/..../pub?output=csv">
            <div class="flex gap-2">
                <button onclick="closeSettings()" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl">취소</button>
                <button onclick="saveSettings()" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl">저장 및 연동</button>
            </div>
        </div>
    </div>

    <script>
        const sampleData = [
            { word: "proper", meaning: "적당한" },
            { word: "apple", meaning: "사과" }
        ];

        let words = [];
        let currentIndex = 0;
        let isFlipped = false;
        let isProcessing = false;

        window.onload = () => {
            const savedUrl = localStorage.getItem('sheetCsvUrl');
            if (savedUrl) {
                fetchCSVData(savedUrl);
            } else {
                words = shuffleArray([...sampleData]);
                updateUI();
                setStatus('연동 안 됨 (샘플)', 'text-gray-500');
            }
        };

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const firstCommaIndex = line.indexOf(',');
                if (firstCommaIndex > -1) {
                    let w = line.substring(0, firstCommaIndex).trim().replace(/^"|"$/g, '');
                    let m = line.substring(firstCommaIndex + 1).trim().replace(/^"|"$/g, '');
                    if (w) result.push({ word: w, meaning: m });
                }
            }
            return result;
        }

        async function fetchCSVData(url) {
            if (!url) {
                words = shuffleArray([...sampleData]);
                updateUI();
                setStatus('연동 안 됨 (샘플)', 'text-gray-500');
                return;
            }
            setStatus('불러오는 중...', 'text-blue-500');
            try {
                const cacheBuster = `&t=${new Date().getTime()}`;
                const fetchUrl = url.includes('?') ? url + cacheBuster : url + '?' + cacheBuster.substring(1);

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error('네트워크 응답 에러');
                
                const text = await response.text();
                const data = parseCSV(text);

                if (data && data.length > 0) {
                    words = shuffleArray(data);
                    currentIndex = 0;
                    isFlipped = false;
                    document.querySelector('.card-container').classList.remove('flipped');
                    updateUI();
                    setStatus('정상 연동됨', 'text-emerald-600');
                } else {
                    throw new Error('데이터가 비어있습니다.');
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                words = shuffleArray([...sampleData]);
                updateUI();
                setStatus('연동 오류 (샘플)', 'text-red-500');
            }
        }

        function setStatus(text, colorClass) {
            const statusEl = document.getElementById('statusText');
            statusEl.innerText = text;
            statusEl.className = `text-xs font-semibold ${colorClass}`;
        }

        function updateUI() {
            if (words.length === 0) return;
            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${words.length}`;
            document.getElementById('meaningText').innerText = words[currentIndex].meaning;
            document.getElementById('wordText').innerText = words[currentIndex].word;
        }

        function toggleCard() {
            if (isProcessing) return;
            const container = document.querySelector('.card-container');
            isFlipped = !isFlipped;
            if (isFlipped) {
                container.classList.add('flipped');
            } else {
                container.classList.remove('flipped');
            }
        }

        // '몰랐어요' / '알고 있었어요' 버튼 공통 처리 함수
        function nextWord(isKnown) {
            if (isProcessing) return;

            const container = document.querySelector('.card-container');
            isProcessing = true;

            // 이미 뒤집혀 있던 상태라면 강제로 앞면으로 리셋 후 애니메이션 재시작
            if (isFlipped) {
                isFlipped = false;
                container.classList.remove('flipped');
            }

            // 아주 짧은 딜레이 후 뒷면(영단어)으로 뒤집기
            setTimeout(() => {
                isFlipped = true;
                container.classList.add('flipped');
            }, 50);

            // 알고 있었어요는 짧게(0.7초), 몰랐어요는 길게(1.4초) 영단어를 보여준 뒤 다음 문제로 이동
            const waitTime = isKnown ? 700 : 1400;

            setTimeout(() => {
                proceedToNext();
                isProcessing = false;
            }, waitTime);
        }

        function proceedToNext() {
            currentIndex++;
            if (currentIndex >= words.length) {
                alert('모든 단어를 학습했습니다! 순서를 섞어 다시 시작합니다.');
                words = shuffleArray(words);
                currentIndex = 0;
            }
            
            isFlipped = false;
            document.querySelector('.card-container').classList.remove('flipped');
            
            setTimeout(() => {
                updateUI();
            }, 150);
        }

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function openSettings() {
            const savedUrl = localStorage.getItem('sheetCsvUrl') || '';
            document.getElementById('sheetUrlInput').value = savedUrl;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const url = document.getElementById('sheetUrlInput').value.trim();
            localStorage.setItem('sheetCsvUrl', url);
            closeSettings();
            fetchCSVData(url);
        }

        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: '모바일 영단어 퀴즈',
                    text: '구글 시트 영단어장 모바일 퀴즈',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                alert('현재 브라우저에서 공유 기능을 지원하지 않습니다.');
            }
        }
    </script>
</body>
</html>
