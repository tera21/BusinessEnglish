<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 영단어 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .card-container { perspective: 1000px; }
        .card-inner { transition: transform 0.4s; transform-style: preserve-3d; }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .flipped .card-inner { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <!-- Header -->
    <header class="bg-white px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">모바일 영단어 퀴즈</h1>
                <p id="statusText" class="text-xs font-semibold text-emerald-600">연동 중...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="shareLink()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg></button>
            <button onclick="openSettings()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col p-4 max-w-lg mx-auto w-full">
        <!-- Progress Bar -->
        <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-sm mb-4">
            <div class="flex items-center gap-2">
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-1 rounded">진행도</span>
                <span id="progressText" class="font-bold text-gray-800">0 / 0</span>
            </div>
            <button onclick="reloadData()" class="text-sm font-semibold text-emerald-600 flex items-center gap-1 hover:text-emerald-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 새로고침
            </button>
        </div>

        <!-- Flashcard -->
        <div class="flex-1 flex flex-col justify-center mb-6 card-container" onclick="toggleCard()">
            <div id="cardInner" class="card-inner relative w-full h-80 bg-white rounded-3xl shadow-lg border border-gray-100 flex items-center justify-center cursor-pointer p-6">
                
                <!-- 뜻 (앞면) -->
                <div class="card-front absolute w-full h-full flex flex-col items-center justify-center p-6 bg-white rounded-3xl">
                    <p class="text-sm font-bold text-gray-400 mb-4 tracking-widest">뜻 (MEANING)</p>
                    <h2 id="meaningText" class="text-4xl font-extrabold text-gray-800 text-center break-keep">단어 뜻</h2>
                    <div class="absolute bottom-6 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        화면을 터치해 단어 확인
                    </div>
                </div>

                <!-- 영단어 (뒷면) -->
                <div class="card-back absolute w-full h-full flex flex-col items-center justify-center p-6 bg-emerald-600 rounded-3xl text-white">
                    <p class="text-sm font-bold text-emerald-200 mb-4 tracking-widest opacity-80">영단어 (WORD)</p>
                    <h2 id="wordText" class="text-5xl font-extrabold text-center mb-6 break-words">Word</h2>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mt-auto">
            <button onclick="nextWord(false)" class="flex-1 bg-white border-2 border-gray-200 text-gray-700 font-bold py-4 rounded-2xl shadow-sm active:bg-gray-50 flex justify-center items-center gap-2 text-lg">
                <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> 몰랐어요
            </button>
            <button onclick="nextWord(true)" class="flex-1 bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-sm active:bg-emerald-700 flex justify-center items-center gap-2 text-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 알고 있었어요
            </button>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-gray-900 mb-4">설정 및 연동</h3>
            
            <div class="bg-blue-50 text-blue-800 text-sm p-4 rounded-xl mb-4 leading-relaxed">
                <p class="font-bold mb-1">🚨 [중요] 연동 방식 변경 안내</p>
                모바일 Safari 에러 방지를 위해 <b>Apps Script URL 대신 CSV 링크</b>를 사용합니다.<br><br>
                <b>[연동 방법]</b><br>
                1. 구글 시트 메뉴: <b>파일 > 공유 > 웹에 게시</b><br>
                2. '전체 문서' 옆에 <b>'쉼표로 분리된 값 (.csv)'</b> 선택 후 <b>[게시]</b> 클릭<br>
                3. 생성된 <b>CSV 링크</b>를 복사해서 아래에 붙여넣기 하세요.
            </div>

            <label class="block text-sm font-bold text-gray-700 mb-2">구글 시트 CSV 링크</label>
            <input type="text" id="sheetUrlInput" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm mb-6 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
            
            <div class="flex gap-2">
                <button onclick="closeSettings()" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl">취소</button>
                <button onclick="saveSettings()" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl">저장 및 연동</button>
            </div>
        </div>
    </div>

    <script>
        // 기본 샘플 데이터 (시트의 데이터 구조와 일치)
        const sampleData = [
            { word: "proper", meaning: "적당한" },
            { word: "apple", meaning: "사과" }
        ];

        let words = [];
        let currentIndex = 0;
        let isFlipped = false;

        // 시작 시 데이터 로드
        window.onload = () => {
            const savedUrl = localStorage.getItem('sheetCsvUrl');
            if (savedUrl) {
                fetchCSVData(savedUrl);
            } else {
                words = shuffleArray([...sampleData]);
                updateUI();
                setStatus('연동 안 됨 (샘플 데이터)', 'text-gray-500');
            }
        };

        // CSV 파싱 함수 (강력한 버전)
        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) { // 1번째 줄(헤더) 건너뜀
                const line = lines[i].trim();
                if (!line) continue;
                
                // 첫 번째 쉼표를 기준으로 단어와 뜻을 분리 (뜻에 쉼표가 들어갈 수 있으므로)
                const firstCommaIndex = line.indexOf(',');
                if (firstCommaIndex > -1) {
                    let w = line.substring(0, firstCommaIndex).trim();
                    let m = line.substring(firstCommaIndex + 1).trim();
                    
                    // 큰따옴표 제거
                    w = w.replace(/^"|"$/g, '');
                    m = m.replace(/^"|"$/g, '');
                    
                    if (w) result.push({ word: w, meaning: m });
                }
            }
            return result;
        }

        // 구글 시트 CSV 실시간 데이터 가져오기 (사파리 캐시 방지 포함)
        async function fetchCSVData(url) {
            setStatus('불러오는 중...', 'text-blue-500');
            try {
                // 사파리 캐시(이전 데이터 기억) 방지용 파라미터 추가
                const cacheBuster = `&t=${new Date().getTime()}`;
                const fetchUrl = url.includes('?') ? url + cacheBuster : url + '?' + cacheBuster.substring(1);

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error('네트워크 응답 에러');
                
                const text = await response.text();
                const data = parseCSV(text);

                if (data && data.length > 0) {
                    words = shuffleArray(data);
                    currentIndex = 0;
                    isFlipped = false;
                    document.getElementById('cardInner').classList.remove('flipped');
                    updateUI();
                    setStatus('정상 연동됨', 'text-emerald-600');
                } else {
                    throw new Error('데이터가 비어있습니다.');
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                words = shuffleArray([...sampleData]);
                updateUI();
                setStatus('연동 오류 (샘플 전환)', 'text-red-500');
                
                // 만약 사용자가 Apps Script URL을 넣었다면 에러 경고창 띄우기
                if(url.includes('/exec')) {
                    alert('입력하신 링크는 Apps Script 링크입니다.\n설정 창 안내에 따라 [웹에 게시(CSV)] 링크로 변경해주세요!');
                }
            }
        }

        function reloadData() {
            const savedUrl = localStorage.getItem('sheetCsvUrl');
            if (savedUrl) {
                fetchCSVData(savedUrl);
            } else {
                alert('설정(우측 상단 톱니바퀴)에서 구글 시트 CSV 링크를 먼저 등록해주세요.');
            }
        }

        // 상태 텍스트 업데이트
        function setStatus(text, colorClass) {
            const statusEl = document.getElementById('statusText');
            statusEl.innerText = text;
            statusEl.className = `text-xs font-semibold ${colorClass}`;
        }

        // 화면 UI 업데이트
        function updateUI() {
            if (words.length === 0) return;
            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${words.length}`;
            document.getElementById('meaningText').innerText = words[currentIndex].meaning;
            document.getElementById('wordText').innerText = words[currentIndex].word;
        }

        // 카드 뒤집기
        function toggleCard() {
            const card = document.getElementById('cardInner');
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('flipped');
            } else {
                card.classList.remove('flipped');
            }
        }

        // 다음 단어 넘어가기
        function nextWord(isKnown) {
            // 카드가 앞면(뜻)인 상태에서 바로 '알고있어요'를 눌렀다면 뒷면을 잠깐 보여줄 수도 있지만,
            // 퀴즈 속도를 위해 바로 다음 문제로 넘어갑니다.
            
            currentIndex++;
            if (currentIndex >= words.length) {
                alert('모든 단어를 학습했습니다! 순서를 섞어 다시 시작합니다.');
                words = shuffleArray(words);
                currentIndex = 0;
            }
            
            isFlipped = false;
            document.getElementById('cardInner').classList.remove('flipped');
            
            // 카드 뒤집히는 애니메이션이 끝난 직후 텍스트 업데이트 (자연스러운 전환)
            setTimeout(() => {
                updateUI();
            }, 150);
        }

        // 배열 랜덤 섞기
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // 모달창 컨트롤
        function openSettings() {
            const savedUrl = localStorage.getItem('sheetCsvUrl') || '';
            document.getElementById('sheetUrlInput').value = savedUrl;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const url = document.getElementById('sheetUrlInput').value.trim();
            if (url) {
                localStorage.setItem('sheetCsvUrl', url);
                closeSettings();
                fetchCSVData(url);
            } else {
                alert('URL을 입력해주세요.');
            }
        }

        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: '모바일 영단어 퀴즈',
                    text: '나만의 구글 시트 영단어장을 모바일 퀴즈로 학습해보세요!',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                alert('현재 브라우저에서는 공유 기능을 지원하지 않습니다.\n주소창의 링크를 복사해주세요!');
            }
        }
    </script>
</body>
</html>
